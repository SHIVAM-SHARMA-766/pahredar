name: pahredar

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on localhost only, for running the backend outside Docker.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      CVELIST_SYNC_INTERVAL: ${CVELIST_SYNC_INTERVAL:-1h}
      NVD_SYNC_INTERVAL: ${NVD_SYNC_INTERVAL:-2h}
      KEV_SYNC_INTERVAL: ${KEV_SYNC_INTERVAL:-6h}
      EPSS_SYNC_INTERVAL: ${EPSS_SYNC_INTERVAL:-6h}
      EXPLOITS_SYNC_INTERVAL: ${EXPLOITS_SYNC_INTERVAL:-24h}
      STATS_REFRESH_INTERVAL: ${STATS_REFRESH_INTERVAL:-6h}
      DATA_DIR: /var/lib/pahredar
    volumes:
      # Scratch space for downloads; the bootstrap needs ~700 MB temporarily.
      - workdir:/var/lib/pahredar
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/pahredar", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  workdir:
