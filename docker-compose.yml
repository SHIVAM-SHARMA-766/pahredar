name: pahredar

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Published on localhost only, for running the backend outside Docker.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      NVD_API_KEY: ${NVD_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      VULNCHECK_API_TOKEN: ${VULNCHECK_API_TOKEN:-}
      OTX_API_KEY: ${OTX_API_KEY:-}
      ABUSECH_AUTH_KEY: ${ABUSECH_AUTH_KEY:-}
      BLUESKY_HANDLE: ${BLUESKY_HANDLE:-}
      BLUESKY_APP_PASSWORD: ${BLUESKY_APP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      CVELIST_SYNC_INTERVAL: ${CVELIST_SYNC_INTERVAL:-1h}
      NVD_SYNC_INTERVAL: ${NVD_SYNC_INTERVAL:-2h}
      KEV_SYNC_INTERVAL: ${KEV_SYNC_INTERVAL:-6h}
      EPSS_SYNC_INTERVAL: ${EPSS_SYNC_INTERVAL:-6h}
      EXPLOITS_SYNC_INTERVAL: ${EXPLOITS_SYNC_INTERVAL:-24h}
      STATS_REFRESH_INTERVAL: ${STATS_REFRESH_INTERVAL:-6h}
      CWE_SYNC_INTERVAL: ${CWE_SYNC_INTERVAL:-168h}
      FEEDS_SYNC_INTERVAL: ${FEEDS_SYNC_INTERVAL:-1h}
      DETECTION_SYNC_INTERVAL: ${DETECTION_SYNC_INTERVAL:-24h}
      CONTEXT_SYNC_INTERVAL: ${CONTEXT_SYNC_INTERVAL:-24h}
      GREENBONE_SYNC_INTERVAL: ${GREENBONE_SYNC_INTERVAL:-}
      DATA_DIR: /var/lib/pahredar
      # Endpoint scanner. Active (Nuclei) scanning and scanning private /
      # internal targets are both off by default; enable on a trusted,
      # single-user instance only.
      SCAN_ALLOW_PRIVATE: ${SCAN_ALLOW_PRIVATE:-false}
      SCAN_ACTIVE_ENABLED: ${SCAN_ACTIVE_ENABLED:-false}
      ASSET_RESCAN_INTERVAL: ${ASSET_RESCAN_INTERVAL:-24h}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_EPSS_THRESHOLD: ${ALERT_EPSS_THRESHOLD:-0.5}
      API_KEY: ${API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-pahredar@localhost}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      NUCLEI_PATH: /usr/local/bin/nuclei
      NUCLEI_TEMPLATES_DIR: ${NUCLEI_TEMPLATES_DIR:-/opt/nuclei-templates}
    volumes:
      # Scratch space for downloads; the bootstrap needs ~700 MB temporarily.
      - workdir:/var/lib/pahredar
    # Lets the scanner reach services on the Docker host as host.docker.internal
    # (only useful with SCAN_ALLOW_PRIVATE=true).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/pahredar", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3001}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  pgdata:
  workdir:
